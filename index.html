<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css"> <!-- link the CSS file -->
</head>
<body>
<div class="card">
    <div class="search">
        <input type="text" placeholder="Enter the city name" spellcheck="false">
        <button><img src="images/search.png"></button>
    </div>
    <div class ="error">City not found</div>

    <div class="weather">
        <img src="images/rain.png" class="Weather-icon" >
        <h1 class="temp">22°C</h1>
        <h2 class="city">London</h2>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png">
                <div>
                    <p class="wind">15 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const apiKey = "c4206c033365ab072ffc3c05558f773d";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?q={city}&units=metric";
    const searchBox = document.querySelector(".search input");
    const searchButton = document.querySelector(".search button");

    async function getWeather(city) {
        const response = await fetch(apiUrl.replace("{city}", city) + `&appid=${apiKey}`);
        
        if (response.status == 404) {
            document.querySelector(".error").style.display = "block";
            document.querySelector(".weather").style.display = "none";
        } else {
            var data = await response.json();

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";

            if (data.weather[0].main == "Clouds") {
                document.querySelector(".Weather-icon").src = "images/cloud.png";
            } else if (data.weather[0].main == "Clear") {
                document.querySelector(".Weather-icon").src = "images/clear.png";
            } else if (data.weather[0].main == "Rain") {
                document.querySelector(".Weather-icon").src = "images/rain.png";
            } else if (data.weather[0].main == "Drizzle") {
                document.querySelector(".Weather-icon").src = "images/drizzle.png";
            } else if (data.weather[0].main == "Mist") {
                document.querySelector(".Weather-icon").src = "images/mist.png";
            }

            document.querySelector(".weather").style.display = "block";
            document.querySelector(".error").style.display = "none";
        }
    }

    searchBox.addEventListener("keypress",(event)=>{
        if(event.key === "Enter"){
            getWeather(searchBox.value);
        }
    })

    searchButton.addEventListener("click", () =>{
        getWeather(searchBox.value);
    });

</script>

</body>
</html>
